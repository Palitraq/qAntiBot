  success: "&aВы успешно прошли проверку!"
  timer-expired: "&cВремя вышло! Вы не успели нажать."
  reload: "&aКонфиг перезагружен."

  player-not-found: "&cИгрок не найден."
  already-verified: "&cЭтот игрок уже прошел проверку или проходит её."
  forced-pass: "&aИгрок %player% принудительно прошел проверку."
  forced-start: "&aПроверка запущена для игрока %player%."
