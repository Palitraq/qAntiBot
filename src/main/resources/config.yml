settings:
  # Время на решение одного этапа (в секундах)
  time-per-round: 10
  # Количество киков до бана
  max-kicks-before-ban: 3
  # Время бана в минутах
  ban-time-minutes: 5
  # Сколько дней игрок не будет видеть капчу после прохождения (иммунитет по IP)
  immunity-days: 3

messages:
  prefix: "&8[&bqAnti&fBot&8] "
  # Сообщение при входе больше не используется (работает автоматически), но можно оставить
